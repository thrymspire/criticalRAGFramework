# Tuned PostgreSQL 18 Configuration for Local NVMe SSD and Vector Workloads
shared_buffers = 1GB
work_mem = 64MB
maintenance_work_mem = 512MB
max_parallel_maintenance_workers = 4
wal_level = minimal
max_wal_senders = 0
synchronous_commit = off
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9
max_wal_size = 4GB
min_wal_size = 512MB
listen_addresses = '127.0.0.1'
port = 5432
